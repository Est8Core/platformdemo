<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LogoSplash — preview</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    display:grid; grid-template-rows:1fr auto; transition:background .3s ease;
  }
  body[data-t="dark"]{background:#0a0b0d;color:#8b93a1}
  body[data-t="light"]{background:#fbfaf7;color:#6b6558}

  #stage{display:grid;place-items:center;padding:24px;overflow:hidden}
  #stage svg{width:min(56vh,60vw,400px);height:auto;display:block}

  #panel{
    display:flex;flex-wrap:wrap;gap:18px 22px;align-items:center;justify-content:center;
    padding:16px 20px 22px;border-top:1px solid;transition:border-color .3s ease
  }
  body[data-t="dark"] #panel{border-color:#1c1f26;background:#0d0f12}
  body[data-t="light"] #panel{border-color:#eae5da;background:#fff}

  .ctl{display:flex;align-items:center;gap:9px}
  .ctl > label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6}

  .seg{display:flex;border-radius:8px;overflow:hidden;border:1px solid}
  body[data-t="dark"] .seg{border-color:#262b34}
  body[data-t="light"] .seg{border-color:#e2dccf}
  .seg button{
    appearance:none;border:0;background:transparent;color:inherit;cursor:pointer;
    padding:7px 14px;font:inherit;font-size:13px;transition:background .15s,color .15s
  }
  .seg button[aria-pressed="true"]{background:#C8A24B;color:#12141a;font-weight:600}

  input[type=range]{width:170px;accent-color:#C8A24B}
  .num{font-variant-numeric:tabular-nums;min-width:42px;font-weight:600;color:#C8A24B}

  #replay{
    appearance:none;border:1px solid #C8A24B;background:transparent;color:#C8A24B;
    border-radius:8px;padding:7px 18px;font:inherit;font-weight:600;cursor:pointer;
    transition:background .15s,color .15s
  }
  #replay:hover{background:#C8A24B;color:#12141a}
  #replay[disabled]{opacity:.35;cursor:default}
  #replay[disabled]:hover{background:transparent;color:#C8A24B}

  code{
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:6px 10px;border-radius:6px;white-space:nowrap
  }
  body[data-t="dark"] code{background:#14171c;color:#9aa3b2}
  body[data-t="light"] code{background:#f4f0e7;color:#7a7264}

  #cyc{font-size:11px;opacity:.55;min-width:104px}
</style>
</head>
<body data-t="dark">

  <div id="stage"></div>

  <div id="panel">
    <div class="ctl">
      <label>Theme</label>
      <div class="seg" id="theme">
        <button data-v="dark" aria-pressed="true">dark</button>
        <button data-v="light" aria-pressed="false">light</button>
      </div>
    </div>

    <div class="ctl">
      <label>Arc</label>
      <div class="seg" id="arc">
        <button data-v="true" aria-pressed="true">on</button>
        <button data-v="false" aria-pressed="false">off</button>
      </div>
    </div>

    <div class="ctl">
      <label>autoReplay</label>
      <div class="seg" id="loop">
        <button data-v="false" aria-pressed="true">off</button>
        <button data-v="true" aria-pressed="false">on</button>
      </div>
    </div>

    <div class="ctl">
      <label>Speed</label>
      <input type="range" id="range" min="0.4" max="3" step="0.1" value="1.5" />
      <span class="num" id="spd">1.5</span>
    </div>

    <button id="replay">Replay</button>
    <span id="cyc"></span>
    <code id="snippet"></code>
  </div>

pe=\"scale\" values=\"0.15;1.24;0.94;1.03;1\" keyTimes=\"0;0.42;0.68;0.86;1\" dur=\"0.65s\" begin=\"2.05s\" fill=\"freeze\" calcMode=\"spline\" keySplines=\"0.2 0.9 0.3 1;0.4 0 0.5 1;0.4 0 0.5 1;0.4 0 0.5 1\"></animateTransform><animateTransform attributeName=\"transform\" type=\"scale\" values=\"1;1.055;1\" dur=\"2.4s\" begin=\"2.9s\" repeatCount=\"indefinite\" additive=\"sum\" calcMode=\"spline\" keyTimes=\"0;0.5;1\" keySplines=\"0.45 0 0.55 1;0.45 0 0.55 1\"></animateTransform><ellipse rx=\"47\" ry=\"42\" fill=\"#16D6BF\" opacity=\"0.35\" filter=\"url(#fGlowR0)\"></ellipse><ellipse rx=\"38\" ry=\"33\" fill=\"#16D6BF\"></ellipse><ellipse cx=\"-9\" cy=\"-8\" rx=\"13\" ry=\"10\" fill=\"#8DF6E8\" opacity=\"0.45\"></ellipse></g></g></g></svg>"};
  const state = { theme:"dark", arc:true, loop:false, speed:1.5 };
  let timer = null;

  // Same transform the component applies: every SMIL time divided by speed.
  function retime(svgText, speed){
    return svgText.replace(/(dur|begin)="([\d.]+)s"/g, (_, attr, val) =>
      attr + '="' + (+(parseFloat(val)/speed).toFixed(4)) + 's"');
  }

  // The cycle length is read back off the exit-fade animation rather than
  // hardcoded here, so this page can't drift out of sync with the component.
  function cycleMs(svgText){
    const m = svgText.match(/<g><animate attributeName="opacity" values="1;1;0"[^>]*dur="([\d.]+)s"/);
    return m ? parseFloat(m[1]) * 1000 : null;
  }

  function paint(){
    document.body.dataset.t = state.theme;
    const src = retime(BASE[state.theme + "|" + state.arc + "|" + state.loop], state.speed);
    // replacing the node remounts it, which is what restarts SMIL
    document.getElementById("stage").innerHTML = src;

    document.getElementById("spd").textContent = state.speed.toFixed(1);
    document.getElementById("replay").disabled = state.loop;
    document.getElementById("snippet").textContent =
      '<LogoSplash theme="' + state.theme + '" speed={' + state.speed.toFixed(1) + '}' +
      (state.arc ? '' : ' arc={false}') +
      (state.loop ? ' autoReplay' : '') + ' />';

    clearTimeout(timer);
    const ms = state.loop ? cycleMs(src) : null;
    document.getElementById("cyc").textContent = ms ? "cycle " + (ms/1000).toFixed(2) + "s" : "";
    if (ms) timer = setTimeout(paint, ms + 80);
  }

  function bindSeg(id, key, cast){
    document.querySelectorAll("#" + id + " button").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#" + id + " button")
          .forEach(o => o.setAttribute("aria-pressed", String(o === b)));
        state[key] = cast(b.dataset.v);
        paint();
      });
    });
  }

  bindSeg("theme", "theme", v => v);
  bindSeg("arc", "arc", v => v === "true");
  bindSeg("loop", "loop", v => v === "true");

  document.getElementById("range").addEventListener("input", e => {
    state.speed = parseFloat(e.target.value);
    paint();
  });
  document.getElementById("replay").addEventListener("click", paint);

  paint();
</script>
